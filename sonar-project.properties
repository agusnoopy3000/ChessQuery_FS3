# ── SonarQube — ChessQuery (monorepo poliglota: Java + TS + Python) ──────────
sonar.projectKey=chessquery
sonar.projectName=ChessQuery
sonar.sourceEncoding=UTF-8

# Fuentes y tests (el split source/test lo da test.inclusions).
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*Test.java,**/*IT.java,**/*.spec.ts,**/*.spec.tsx,**/test/**,ms-etl/tests/**

# Excluir lo que no es código de la app.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  **/build/**,\
  **/coverage/**,\
  **/.venv/**,\
  archetypes/**,\
  docs/**,\
  supabase/**,\
  Presentacion 2/**,\
  **/*.log,\
  **/*.md,\
  **/*.html,\
  frontend/**/*.config.ts

# ── Java (binarios + cobertura JaCoCo) ───────────────────────────────────────
sonar.java.binaries=\
  api-gateway/target/classes,\
  ms-users/target/classes,\
  ms-tournament/target/classes,\
  ms-game/target/classes,\
  ms-notifications/target/classes,\
  ms-analytics/target/classes
sonar.coverage.jacoco.xmlReportPaths=\
  api-gateway/target/site/jacoco/jacoco.xml,\
  ms-users/target/site/jacoco/jacoco.xml,\
  ms-tournament/target/site/jacoco/jacoco.xml,\
  ms-game/target/site/jacoco/jacoco.xml,\
  ms-notifications/target/site/jacoco/jacoco.xml,\
  ms-analytics/target/site/jacoco/jacoco.xml

# ── Frontend (TS, cobertura lcov de vitest) ──────────────────────────────────
sonar.javascript.lcov.reportPaths=\
  frontend/apps/chess-portal/coverage/lcov.info,\
  frontend/apps/organizer-panel/coverage/lcov.info

# ── Python (ETL) ─────────────────────────────────────────────────────────────
sonar.python.version=3.11
