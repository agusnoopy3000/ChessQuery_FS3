name: Build & push images to ECR

on:
  # Disparo automático en push deshabilitado: las credenciales de AWS Academy rotan
  # cada ~4h y no se pueden mantener frescas en GitHub Secrets, así que este job
  # fallaba en cada push a main (ruido rojo). El deploy se hace manualmente desde
  # local (scripts/build-push-ecr.sh). Queda disponible para correr a mano.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag adicional para las imágenes (además de sha-XXXXXXX)'
        required: false
        default: ''

permissions:
  id-token: write   # necesario si se usa OIDC en lugar de access keys
  contents: read

jobs:
  build-push:
    name: Build & push (${{ matrix.service }})
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: infrastructure/docker/api-gateway/Dockerfile
          - service: ms-users
            dockerfile: infrastructure/docker/ms-users/Dockerfile
          - service: ms-tournament
            dockerfile: infrastructure/docker/ms-tournament/Dockerfile
          - service: ms-game
            dockerfile: infrastructure/docker/ms-game/Dockerfile
          - service: ms-notifications
            dockerfile: infrastructure/docker/ms-notifications/Dockerfile
          - service: ms-analytics
            dockerfile: infrastructure/docker/ms-analytics/Dockerfile
          - service: bff-player
            dockerfile: infrastructure/docker/bff-player/Dockerfile
          - service: bff-organizer
            dockerfile: infrastructure/docker/bff-organizer/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: env.USE_OIDC == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
        env:
          USE_OIDC: ${{ secrets.GH_OIDC_ROLE_ARN != '' && 'true' || 'false' }}

      - name: Configure AWS credentials (access keys, fallback Academy)
        if: env.USE_OIDC != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
        env:
          USE_OIDC: ${{ secrets.GH_OIDC_ROLE_ARN != '' && 'true' || 'false' }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: tags
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          EXTRA_TAG="${{ github.event.inputs.tag }}"
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "extra_tag=${EXTRA_TAG}" >> $GITHUB_OUTPUT
          echo "ecr_uri=${{ steps.ecr-login.outputs.registry }}/chessquery/${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.tags.outputs.ecr_uri }}:${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.ecr_uri }}:latest
            ${{ steps.tags.outputs.extra_tag != '' && format('{0}:{1}', steps.tags.outputs.ecr_uri, steps.tags.outputs.extra_tag) || '' }}

      # H-07 — Escaneo de vulnerabilidades de la imagen (Trivy).
      #
      # ⚠️ MODO REPORTE A PROPÓSITO (exit-code: '0'): escanea la imagen y deja el
      # resultado visible en el log del CI, pero NO falla el build. Se eligió
      # reporte-y-no-gate porque H-06 (subir Spring Boot 3.2.4 / Spring Cloud 2023,
      # fuera de soporte, + major de NestJS en los BFFs) está DIFERIDO. Un gate
      # duro marcaría esos CVEs —que tienen fix en 3.3+/2024.x— y bloquearía el
      # deploy del CI/CD (T6) hasta cerrar H-06; no queremos atarnos las manos.
      #
      # 🔒 PARA ENDURECER (hacer cuando H-06 esté cerrado y se monte el CI/CD real):
      #     exit-code: '1'        # falla el build ante HIGH/CRITICAL
      #     ignore-unfixed: true  # ignora CVEs sin parche disponible (ruido del SO base)
      # Así el push/deploy se frena si entra una imagen con vuln crítica con fix.
      - name: Scan image for vulnerabilities (Trivy — report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.tags.outputs.ecr_uri }}:${{ steps.tags.outputs.sha_tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'         # report-only: nunca falla el build (ver comentario arriba)
          ignore-unfixed: false  # en modo reporte mostramos todo; al endurecer → true

      - name: Output image URI
        run: |
          echo "::notice title=Image pushed::${{ steps.tags.outputs.ecr_uri }}:${{ steps.tags.outputs.sha_tag }}"
