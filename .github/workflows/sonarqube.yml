name: SonarQube

# Análisis estático + cobertura sobre SonarQube self-hosted.
# Requiere secrets del repo: SONAR_HOST_URL (URL del server) y SONAR_TOKEN.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '*.drawio', 'tools/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '*.drawio', 'tools/**']

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Análisis SonarQube
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo → blame para "new code"

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Maven 3.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Genera target/classes + jacoco.xml por módulo (gate JaCoCo en fase test).
      - name: Tests Java + cobertura (JaCoCo)
        run: |
          for m in api-gateway ms-users ms-tournament ms-game ms-notifications ms-analytics; do
            echo "── $m ──"
            (cd "$m" && mvn -B -ntp -DskipITs test)
          done

      # Genera coverage/lcov.info por app (vitest --coverage, reporter lcov).
      - name: Tests frontend + cobertura (lcov)
        working-directory: frontend
        run: |
          npm ci
          npm --prefix apps/chess-portal test
          npm --prefix apps/organizer-panel test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Falla el job si el Quality Gate no pasa (necesita el server configurado).
      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
